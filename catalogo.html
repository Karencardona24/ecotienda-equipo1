<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carvan Energy - Catálogo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tienda.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado p-4 mb-4 rounded">
        <img src="images/logoCarVan.png" alt="Descripción de la imagen" class="logo-img">
        <h1>Catálogo</h1>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="row mb-3">
            <div class="col-md-6 mb-2">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar producto por nombre...">
            </div>
            <div class="col-md-6">
                <div class="filtros">
                    <button class="filtro activo" data-categoria="todas">Todas</button>
                    <button class="filtro" data-categoria="iluminacion">Iluminación</button>
                    <button class="filtro" data-categoria="electrodomesticos">Electrodomésticos</button>
                    <button class="filtro" data-categoria="solar">Energía Solar</button>
                    <button class="filtro" data-categoria="insumos">Insumos</button>
                </div>
            </div>
        </div>

        <div class="catalogo">
            <div id="productos" class="tarjetas"></div>
            <aside id="carrito" class="p-3 rounded">
                <h2>Tu Carrito</h2>
                <ul id="lista-carrito" class="list-unstyled"></ul>
                <p id="total" class="fw-bold"></p>
                <p id="ahorro" class="text-success fw-bold"></p>
                <button id="vaciar" class="btn-peligro w-100">Vaciar carrito</button>
            </aside>
        </div>
    </main>

    <footer class="pie mt-4 pt-3">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
